<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><title>Sign in | Latter UP</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="editorial.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem("lu-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body><div id="site-header"></div>
<main class="wrap adm" style="max-width:460px">
<section id="in"><h1>Sign in</h1><p>Use your <strong>@latterup.org</strong> Google account.</p>
<div><button class="auth-btn alt" id="google" type="button">Continue with Google</button></div>
<p class="auth-error" id="e1" role="alert" hidden></p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script src="icons.js"></script>
<script src="layout.js"></script>
<script>
const sb = window.LUsb || supabase.createClient(LU_CONFIG.url, LU_CONFIG.key), $ = id => document.getElementById(id);
const requestedPage = new URLSearchParams(location.search).get("next");
const nextPage = requestedPage && /^[a-z0-9-]+\.html$/i.test(requestedPage) && !["login.html", "change-password.html"].includes(requestedPage.toLowerCase())
  ? requestedPage
  : "index.html";
const postSignInPage = user => user.app_metadata?.must_change_password || user.user_metadata?.must_change_password
  ? "change-password.html?next=" + encodeURIComponent(nextPage)
  : nextPage;
const err = (id, m) => { $(id).textContent = m; $(id).hidden = false; };
const openedFromDisk = location.protocol === "file:";
const oauthError = new URLSearchParams(location.search).get("error_description")
  || new URLSearchParams(location.hash.slice(1)).get("error_description");
if (oauthError) err("e1", "Google sign-in couldn't be completed. Please try again with your @latterup.org account.");
(async () => {
  if (openedFromDisk) {
    err("e1", "This site was opened directly from disk, so sign-in cannot be shared reliably between pages. In the project folder, run `py -m http.server 8000` in PowerShell, then open http://localhost:8000. If `py` is unavailable, try `python -m http.server 8000`.");
    $("google").disabled = true;
    return;
  }
  const { data, error } = await sb.auth.getSession();
  if (error) {
    err("e1", "We couldn't check your saved sign-in. You can still try Google sign-in.");
    return;
  }
  if (!data.session) return;
  const { data: verified, error: verificationError } = await sb.auth.getUser();
  if (verificationError || !verified.user) {
    err("e1", "A saved sign-in couldn't be verified. Please try signing in again.");
    return;
  }
  location.replace(postSignInPage(verified.user));
})();
$("google").onclick = async () => {
  if (openedFromDisk) return;
  const callbackUrl = new URL("login.html", location.href);
  callbackUrl.searchParams.set("next", nextPage);
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: callbackUrl.toString(),
      queryParams: { hd: "latterup.org" }
    }
  });
  if (error) return err("e1", "Google sign-in couldn't be started. Please try again.");
};
</script></body></html>
