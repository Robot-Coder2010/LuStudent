[build]
  command = "node netlify-build.cjs"
  publish = "dist"

[[redirects]]
  from = "/PLACEHOLDER/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/photos.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
