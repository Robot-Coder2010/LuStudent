<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"><title>Change password | Latter UP</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="editorial.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem("lu-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script></head>
<body><div id="site-header"></div><main class="wrap adm" style="max-width:460px">
<form id="pw"><h1>Change your password</h1><p>Choose a new password (at least 8 characters) that only you know.</p>
<label>New password<input type="password" data-pw name="a" autocomplete="new-password" minlength="8" required></label>
<label>Type it again<input type="password" data-pw name="b" autocomplete="new-password" minlength="8" required></label>
<label class="chk"><input type="checkbox" class="showpw"> Show password</label>
<div><button class="auth-btn" type="submit">Save password</button> <a class="auth-btn alt" href="index.html">Cancel</a></div><p class="auth-error" id="e2" hidden></p></form>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script src="icons.js"></script><script src="layout.js"></script><script>
const sb = window.LUsb || supabase.createClient(LU_CONFIG.url, LU_CONFIG.key), $ = id => document.getElementById(id);
document.querySelectorAll(".showpw").forEach(c => c.onchange = () => c.closest("form").querySelectorAll("input[data-pw]").forEach(i => i.type = c.checked ? "text" : "password"));
const err = (id, m) => { $(id).textContent = m; $(id).hidden = false; };
(async () => { const { data: { session } } = await sb.auth.getSession(); if (!session) location.replace("login.html"); })();
$("pw").onsubmit = async e => { e.preventDefault(); const f = e.target.elements; if (f.a.value !== f.b.value) return err("e2", "Those two passwords don't match."); const { error } = await sb.auth.updateUser({ password: f.a.value, data: { must_change_password: false } }); error ? err("e2", error.message) : location.replace("index.html"); };
</script></body></html>
